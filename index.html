<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Σύνδεση - ΑΙΓΛΗΣ Mini Market</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="logo-title">ΑΙΓΛΗΣ Mini Market</div>

  <div class="company-photo"><img src="1000006805.png"></div>

  <div class="login-container">
    <h2>Σύνδεση Χρήστη</h2>
    <form action="dashboard.html" method="get">
      <input type="text" name="username" placeholder="Όνομα Χρήστη" required>
      <input type="password" name="password" placeholder="Κωδικός Πρόσβασης" required>
      <button type="submit">Login</button>
    </form>
  </div>

</body>
</html>
